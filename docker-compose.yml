# Compose de production/Dokploy : telecharge des images prêtes depuis GHCR,
# ne construit rien (voir README section 7.4, cd.yml). Pour construire en
# local depuis les sources, utiliser docker-compose.dev.yml en plus :
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Couvre les quatre services, leurs bases et la passerelle.

services:

  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    image: ghcr.io/traorecheikh/eventis-auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3004
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  events-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVENTS_DB_USER}
      POSTGRES_PASSWORD: ${EVENTS_DB_PASSWORD}
      POSTGRES_DB: ${EVENTS_DB_NAME}
    volumes:
      - events_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENTS_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  event-service:
    image: ghcr.io/traorecheikh/eventis-event-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${EVENTS_DB_USER}:${EVENTS_DB_PASSWORD}@events-db:5432/${EVENTS_DB_NAME}
      REGISTRATIONS_SERVICE_URL: http://registrations-service:3003
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-3000}
    depends_on:
      events-db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  participants-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PARTICIPANTS_DB_USER}
      POSTGRES_PASSWORD: ${PARTICIPANTS_DB_PASSWORD}
      POSTGRES_DB: ${PARTICIPANTS_DB_NAME}
    volumes:
      - participants_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARTICIPANTS_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  participants-service:
    image: ghcr.io/traorecheikh/eventis-participants-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${PARTICIPANTS_DB_USER}:${PARTICIPANTS_DB_PASSWORD}@participants-db:5432/${PARTICIPANTS_DB_NAME}
    depends_on:
      participants-db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  registrations-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${REGISTRATIONS_DB_USER}
      POSTGRES_PASSWORD: ${REGISTRATIONS_DB_PASSWORD}
      POSTGRES_DB: ${REGISTRATIONS_DB_NAME}
    volumes:
      - registrations_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REGISTRATIONS_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  registrations-service:
    image: ghcr.io/traorecheikh/eventis-registrations-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3003
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${REGISTRATIONS_DB_USER}:${REGISTRATIONS_DB_PASSWORD}@registrations-db:5432/${REGISTRATIONS_DB_NAME}
      EVENTS_SERVICE_URL: http://event-service:3001
      PARTICIPANTS_SERVICE_URL: http://participants-service:3002
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-3000}
    depends_on:
      registrations-db:
        condition: service_healthy
      participants-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ghcr.io/traorecheikh/eventis-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      participants-service:
        condition: service_healthy
      registrations-service:
        condition: service_healthy
    networks:
      - frontend
      - backend

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3010:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  auth_data:
  events_data:
  participants_data:
  registrations_data:
  uptime_kuma_data:
