# Override de developpement local : construit les images depuis les sources
# au lieu de les telecharger depuis GHCR, et publie le port 80 sur l'hote
# (en production, Traefik gere ce port, voir docker-compose.yml et ADR 0005).
# Usage :
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# En production/Dokploy, docker-compose.yml seul suffit (images GHCR, voir
# cd.yml).

services:

  auth-service:
    build: ./auth-service
    image: eventis-auth-service:dev

  event-service:
    build: ./event-service
    image: eventis-event-service:dev

  participants-service:
    build: ./participants-service
    image: eventis-participants-service:dev

  registrations-service:
    build: ./registrations-service
    image: eventis-registrations-service:dev

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: eventis-gateway:dev
    ports:
      - "80:80"
