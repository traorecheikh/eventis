name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:

  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      events: ${{ steps.filter.outputs.events }}
      participants: ${{ steps.filter.outputs.participants }}
      registrations: ${{ steps.filter.outputs.registrations }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth-service/**'
            events:
              - 'event-service/**'
            participants:
              - 'participants-service/**'
            registrations:
              - 'registrations-service/**'
            frontend:
              - 'frontend/**'
              - 'auth-service/**'
              - 'event-service/**'
              - 'participants-service/**'
              - 'registrations-service/**'
            gateway:
              - 'gateway/**'
              - 'frontend/**'
              - 'docker-compose.yml'

  participants-service:
    name: participants-service
    needs: changes
    if: needs.changes.outputs.participants == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: participants_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: participants
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U participants_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://participants_user:ci_password@localhost:5432/participants
      JWT_SECRET: ci-secret-not-used-in-production
    defaults:
      run:
        working-directory: participants-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: participants-service/package-lock.json
      - run: npm ci
      - run: npm run lint:esm
      - run: npx prisma migrate deploy
      - run: npm test

  registrations-service:
    name: registrations-service
    needs: changes
    if: needs.changes.outputs.registrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: registrations_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: registrations
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U registrations_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://registrations_user:ci_password@localhost:5432/registrations
      JWT_SECRET: ci-secret-not-used-in-production
      EVENTS_SERVICE_URL: http://localhost:3001
      PARTICIPANTS_SERVICE_URL: http://localhost:3002
    defaults:
      run:
        working-directory: registrations-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: registrations-service/package-lock.json
      - run: npm ci
      - run: npm run lint:esm
      - run: npx prisma migrate deploy
      - run: npm test

  auth-service:
    name: auth-service
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://auth_user:ci_password@localhost:5432/auth
      JWT_SECRET: ci-secret-not-used-in-production
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - run: npm ci
      - run: npm run lint:esm
      - run: npx prisma migrate deploy
      - run: npm test

  event-service:
    name: event-service
    needs: changes
    if: needs.changes.outputs.events == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: events_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U events_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://events_user:ci_password@localhost:5432/events
      JWT_SECRET: ci-secret-not-used-in-production
    defaults:
      run:
        working-directory: event-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: event-service/package-lock.json

      - run: npm ci
      - run: npm run lint:esm
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            auth-service/package-lock.json
            event-service/package-lock.json
            participants-service/package-lock.json
            registrations-service/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: auth-service
      - run: npm ci
        working-directory: event-service
      - run: npm ci
        working-directory: participants-service
      - run: npm ci
        working-directory: registrations-service
      - run: npm ci

      - run: npm run lint
      - run: npm run test
      - run: npm run generate:api
      - run: npm run build

  gateway:
    name: gateway
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f gateway/Dockerfile -t eventis-gateway-ci .

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparer .env pour docker compose
        run: |
          cp .env.example .env
          sed -i \
            -e 's/JWT_SECRET=.*/JWT_SECRET=ci-secret-not-used-in-production-abcdefgh/' \
            -e 's/AUTH_DB_PASSWORD=.*/AUTH_DB_PASSWORD=ci_password/' \
            -e 's/EVENTS_DB_PASSWORD=.*/EVENTS_DB_PASSWORD=ci_password/' \
            -e 's/PARTICIPANTS_DB_PASSWORD=.*/PARTICIPANTS_DB_PASSWORD=ci_password/' \
            -e 's/REGISTRATIONS_DB_PASSWORD=.*/REGISTRATIONS_DB_PASSWORD=ci_password/' \
            .env

      - name: Construire et demarrer la pile complete
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Attendre que la passerelle soit saine
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' eventis-gateway-1 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "La passerelle n'est jamais devenue healthy"
          docker compose ps
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

      - name: Journaux des services (en cas d'echec)
        if: failure()
        run: docker compose logs

      - name: Arreter la pile
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
