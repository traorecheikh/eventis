worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream auth_service {
        server auth-service:3004;
    }

    upstream event_service {
        server event-service:3001;
    }

    # A activer quand participants-service existe (voir AGENTS.md, section "Etat du depot").
    # upstream participants_service {
    #     server participants-service:3002;
    # }

    # A activer quand registrations-service existe.
    # upstream registrations_service {
    #     server registrations-service:3003;
    # }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Pas de prefixe retire : auth-service ecoute lui-meme sur /api/auth/*.
        # Pas de slash final sur le pattern : couvre /api/auth ET /api/auth/*.
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pas de prefixe retire : event-service ecoute lui-meme sur /api/events/*.
        # Pas de slash final sur le pattern : couvre /api/events ET /api/events/*.
        location /api/events {
            proxy_pass http://event_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location /api/participants {
        #     proxy_pass http://participants_service;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # location /api/registrations {
        #     proxy_pass http://registrations_service;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Remplace par le build Vue (frontend/dist) quand le frontend existe.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
